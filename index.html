<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DP-900 · Cuestionarios</title>
<style>
  :root {
    --navy: #0b3d6e;
    --azul: #0f6cbd;
    --azul-claro: #e8f1fb;
    --cian: #50e6ff;
    --verde: #107c10;
    --verde-claro: #e6f3e6;
    --rojo: #a4262c;
    --rojo-claro: #fdecee;
    --naranja: #c55a11;
    --naranja-claro: #fff4e5;
    --ink: #1b1b1b;
    --muted: #5c6378;
    --line: #c9d6e3;
    --soft: #f4f7fb;
    --bg: #eef2f7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }

  a { color: var(--azul); }

  /* ── Encabezado ─────────────────────────────────────────────── */
  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--navy), var(--azul));
    color: #fff;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
  }
  .top .marca { font-weight: 700; cursor: pointer; letter-spacing: .02em; background: none; border: none; color: #fff; font: inherit; font-weight: 700; padding: 0; }
  .top .marca span { color: var(--cian); }
  .top nav button, .top nav a {
    display: inline-block;
    text-decoration: none;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, .45);
    color: #fff;
    border-radius: 20px;
    padding: 6px 14px;
    margin-left: 6px;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
  }
  .top nav button:hover, .top nav a:hover { background: rgba(255, 255, 255, .15); }

  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(11, 61, 110, .08);
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  h2, h3 { color: var(--navy); }
  h3 { font-size: 17px; margin: 20px 0 10px; }

  /* ── Inicio ─────────────────────────────────────────────────── */
  .hero { margin-bottom: 16px; }
  .hero h1 { margin: 4px 0 6px; color: var(--navy); font-size: 28px; }
  .hero p { margin: 0 0 10px; color: var(--muted); max-width: 760px; }
  .chip {
    display: inline-block;
    background: var(--azul-claro);
    color: var(--navy);
    border-radius: 14px;
    padding: 2px 10px;
    font-size: 13px;
    font-weight: 600;
    margin: 0 6px 6px 0;
  }
  .chip.suave { background: var(--soft); color: var(--muted); font-weight: 500; }
  .modos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .modo-card { display: flex; flex-direction: column; margin: 0; }
  .modo-card h2 { margin: 0 0 6px; font-size: 20px; }
  .modo-card > p { color: var(--muted); margin: 0 0 12px; font-size: 15px; }
  .modo-card .btn.grande { margin-top: auto; }
  .cifra { font-size: 40px; font-weight: 800; color: var(--navy); margin: 0 0 12px; line-height: 1.1; }
  .cifra span { font-size: 15px; color: var(--muted); font-weight: 600; }
  .aviso {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background: var(--naranja-claro);
    border-left: 4px solid var(--naranja);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .campo { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; margin-bottom: 10px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--azul); }
  .cnt { margin-left: auto; color: var(--muted); font-size: 12px; padding-left: 8px; }
  .partes-sel { margin-bottom: 4px; }
  details.temas { margin: 4px 0 10px; font-size: 14px; }
  details.temas summary { cursor: pointer; color: var(--azul); font-weight: 600; }
  .grupo-temas { margin: 6px 0 4px 6px; }
  .gt-tit { font-weight: 700; color: var(--navy); font-size: 13px; margin-top: 8px; }
  .mini { font-size: 13px; color: var(--muted); }
  .pie { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }

  /* ── Botones y controles ────────────────────────────────────── */
  .btn {
    background: var(--azul);
    color: #fff;
    border: 1px solid var(--azul);
    border-radius: 8px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--navy); border-color: var(--navy); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn[disabled]:hover { background: var(--azul); border-color: var(--azul); }
  .btn.sec { background: #fff; color: var(--navy); border-color: var(--line); }
  .btn.sec:hover { background: var(--soft); }
  .btn.sec.activo { background: var(--naranja-claro); border-color: var(--naranja); color: var(--naranja); }
  .btn.grande { width: 100%; padding: 12px; }
  .btn.peligro { background: var(--rojo); border-color: var(--rojo); }
  select {
    font: inherit;
    font-size: 15px;
    padding: 7px 10px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    max-width: 100%;
  }
  select:focus, button:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  select.ok { border-color: var(--verde); background: var(--verde-claro); }
  select.mal { border-color: var(--rojo); background: var(--rojo-claro); }

  /* ── Pregunta ───────────────────────────────────────────────── */
  .quiz-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .modo-tag {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    border-radius: 10px;
    padding: 2px 9px;
    margin-right: 8px;
  }
  .reloj {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 18px;
    color: var(--navy);
    background: #fff;
    border-radius: 8px;
    padding: 4px 12px;
    box-shadow: 0 1px 6px rgba(11, 61, 110, .12);
  }
  .reloj.poco { color: #fff; background: var(--rojo); }
  .marcador { font-weight: 600; color: var(--navy); font-size: 15px; }
  .progreso { height: 6px; background: #dbe3ee; border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .progreso div { height: 100%; background: var(--azul); transition: width .2s; }
  .meta { margin-bottom: 10px; }
  .enun { font-size: 17px; margin-bottom: 14px; }
  .enun pre, .expl pre {
    background: #f6f8fa;
    border: 1px solid var(--line);
    border-left: 3px solid var(--navy);
    border-radius: 4px;
    padding: 8px 12px;
    margin: 8px 0;
    overflow-x: auto;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.4;
  }
  code { font-family: Consolas, "Courier New", monospace; font-size: .92em; background: var(--soft); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
  .enun.completar select { margin: 2px 4px; font-family: inherit; }
  .enun.completar pre select { font-family: Consolas, "Courier New", monospace; font-size: 14px; padding: 2px 6px; }
  .instr { font-size: 13px; color: var(--muted); margin: -6px 0 10px; }

  .opcion {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    margin-bottom: 10px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color .1s, background .1s;
  }
  .opcion:hover:not([disabled]) { border-color: var(--azul); background: var(--soft); }
  .opcion .letra {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--soft);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: var(--navy);
  }
  .opciones.multiple .letra { border-radius: 6px; }
  .opcion .txt { padding-top: 2px; }
  .opcion.sel { border-color: var(--azul); background: var(--azul-claro); }
  .opcion.sel .letra { background: var(--azul); color: #fff; border-color: var(--azul); }
  .opcion[disabled] { cursor: default; color: var(--ink); }
  .opcion.ok { border-color: var(--verde); background: var(--verde-claro); }
  .opcion.ok .letra { background: var(--verde); border-color: var(--verde); color: #fff; }
  .opcion.mal { border-color: var(--rojo); background: var(--rojo-claro); }
  .opcion.mal .letra { background: var(--rojo); border-color: var(--rojo); color: #fff; }
  .opcion.falto { border-color: var(--verde); border-style: dashed; }
  .opcion .marca { margin-left: auto; font-weight: 700; padding-left: 8px; }
  .opcion.ok .marca, .opcion.falto .marca { color: var(--verde); }
  .opcion.mal .marca { color: var(--rojo); }

  table.sino, table.rel { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
  table.sino th, table.sino td, table.rel td { padding: 9px 8px; border-bottom: 1px solid #e3e9f1; text-align: left; vertical-align: middle; }
  table.sino th { font-size: 13px; color: var(--navy); }
  table.sino th:not(:first-child), table.sino td:not(:first-child) { width: 70px; text-align: center; }
  table.rel td:first-child { width: 55%; }
  .sn {
    min-width: 52px;
    padding: 6px 10px;
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    color: var(--navy);
  }
  .sn:hover:not([disabled]) { border-color: var(--azul); }
  .sn[disabled] { cursor: default; }
  .sn.sel { background: var(--azul); color: #fff; border-color: var(--azul); }
  .sn.ok { background: var(--verde); border-color: var(--verde); color: #fff; }
  .sn.mal { background: var(--rojo); border-color: var(--rojo); color: #fff; }
  .sn.falto { border-color: var(--verde); border-style: dashed; color: var(--verde); }
  .correcta { font-size: 14px; color: var(--verde); margin-top: 4px; }

  .expl { border-radius: 10px; padding: 12px 16px; margin-top: 16px; border-left: 4px solid; }
  .expl p { margin: 6px 0; }
  .expl.ok { background: var(--verde-claro); border-color: var(--verde); }
  .expl.mal { background: var(--rojo-claro); border-color: var(--rojo); }
  .expl.parcial { background: var(--naranja-claro); border-color: var(--naranja); }
  .expl-tit { font-weight: 700; }
  .expl.ok .expl-tit { color: var(--verde); }
  .expl.mal .expl-tit { color: var(--rojo); }
  .expl.parcial .expl-tit { color: var(--naranja); }
  .ref { font-size: 13px; color: var(--muted); }

  .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
  .acciones .derecha { margin-left: auto; }
  .paleta { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-top: 8px; }
  .pal {
    height: 34px;
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    position: relative;
    color: var(--ink);
  }
  .pal.resp { background: var(--azul-claro); border-color: var(--azul); }
  .pal.marc::after { content: "★"; position: absolute; top: -8px; right: -4px; color: var(--naranja); font-size: 13px; }
  .pal.act { outline: 2px solid var(--navy); outline-offset: 1px; font-weight: 700; }
  .leyenda { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .leyenda i { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--line); border-radius: 3px; background: #fff; margin-left: 8px; position: relative; }
  .leyenda i.resp { background: var(--azul-claro); border-color: var(--azul); }
  .leyenda i.marc::after { content: "★"; position: absolute; top: -9px; right: -6px; color: var(--naranja); font-size: 11px; font-style: normal; }
  .atajos { font-size: 12px; color: var(--muted); margin-top: 14px; }

  /* ── Resultados ─────────────────────────────────────────────── */
  .res-top { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .res-top p { margin: 4px 0; }
  .puntaje { font-size: 56px; font-weight: 800; line-height: 1; color: var(--navy); white-space: nowrap; }
  .puntaje span { font-size: 18px; color: var(--muted); font-weight: 600; margin-left: 4px; }
  .puntaje.ok { color: var(--verde); }
  .puntaje.mal { color: var(--rojo); }
  .veredicto { font-size: 22px; font-weight: 700; color: var(--navy); }
  .veredicto.ok { color: var(--verde); }
  .veredicto.mal { color: var(--rojo); }
  .alerta { color: var(--naranja); font-weight: 600; }
  .barra-fila { display: grid; grid-template-columns: 210px 1fr 100px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 14px; }
  .barra { height: 12px; background: #e3e9f1; border-radius: 6px; overflow: hidden; }
  .barra div { height: 100%; background: var(--azul); }
  .barra div.ok { background: var(--verde); }
  .barra div.mal { background: var(--naranja); }
  .bv { text-align: right; font-variant-numeric: tabular-nums; }
  .bv small { color: var(--muted); }
  ul.debiles { margin: 0; padding-left: 20px; }
  ul.debiles li { margin-bottom: 4px; }
  .rev-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: 24px 0 10px; }
  .rev-head h2 { margin: 0; }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-btn { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .chip-btn.act { background: var(--navy); color: #fff; border-color: var(--navy); }
  .rev-num { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }

  /* ── Progreso ───────────────────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpis div { background: var(--soft); border-radius: 10px; padding: 12px 14px; }
  .kpis b { display: block; font-size: 26px; color: var(--navy); }
  .kpis span { font-size: 13px; color: var(--muted); }
  table.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.tabla th, table.tabla td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #e3e9f1; }
  table.tabla th { color: var(--navy); font-size: 13px; }
  table.tabla td.num, table.tabla th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pct-bajo { color: var(--rojo); font-weight: 600; }
  .pct-alto { color: var(--verde); font-weight: 600; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy);
    color: #fff;
    padding: 10px 18px;
    border-radius: 24px;
    opacity: 0;
    pointer-events: none;
    transition: .2s;
    z-index: 50;
    max-width: 90vw;
    text-align: center;
  }
  #toast.vis { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 640px) {
    .barra-fila { grid-template-columns: 1fr 80px; }
    .barra-fila .barra { grid-column: 1 / -1; order: 3; }
    table.rel td { display: block; width: 100% !important; border-bottom: none; padding: 4px 0; }
    table.rel tr { display: block; border-bottom: 1px solid #e3e9f1; padding: 8px 0; }
    .puntaje { font-size: 44px; }
  }
</style>
</head>
<body>

<header class="top">
  <button class="marca" data-act="home">DP-900 · <span>Cuestionarios</span></button>
  <nav>
    <button data-act="home">Inicio</button>
    <button data-act="stats">Progreso</button>
    <a href="resumen.html" data-resumen>Resumen</a>
  </nav>
</header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<!--
  Banco de preguntas. Cada pregunta es un objeto; el tipo se deduce de sus campos:
    unica       { q, o: [...], c: índice }
    multiple    { q, o: [...], c: [índices] }
    completar   { q: "texto con ___", o: [...], c: índice }
    sino        { q, a: [["afirmación", 1 | 0], ...] }
    relacionar  { q, pares: [["elemento", "destino"], ...], d: [destinos en orden] (opcional) }
  Campos comunes: e (explicación), h (hoja del resumen, si difiere de la del tema),
  g (grupo de variantes: el simulacro nunca incluye dos preguntas del mismo grupo).
-->
<script>
const BANCO = [];
function T(p, tema, hoja, lista) {
  lista.forEach(function (q) { q.p = p; q.t = tema; q.h = q.h || hoja; BANCO.push(q); });
}
</script>

<script>
/* ═══════════════════ PARTE 1 · CONCEPTOS BÁSICOS DE DATOS ═══════════════════ */

T(1, "Representación de datos", 4, [
  { q: "Una aplicación guarda los perfiles de clientes en documentos JSON. Algunos clientes tienen varios teléfonos en una lista y otros incluyen un objeto anidado <code>preferencias</code>. ¿Cómo se clasifican estos datos?",
    o: ["Semiestructurados", "Estructurados", "No estructurados", "Relacionales normalizados"], c: 0,
    e: "JSON tiene estructura (campos, listas, objetos anidados), pero puede variar entre instancias: eso lo hace <b>semiestructurado</b>. Trampa típica: JSON no es «no estructurado»." },
  { q: "Clasifica cada conjunto de datos según su estructura.",
    pares: [["Tabla de empleados en SQL Server", "Estructurados"], ["Archivo CSV con las mismas columnas en todas las filas", "Estructurados"], ["Documento XML con elementos opcionales", "Semiestructurados"], ["Documento JSON con campos que varían por registro", "Semiestructurados"], ["Grabación MP3 de una llamada al centro de soporte", "No estructurados"], ["Fotografías JPEG de productos", "No estructurados"]],
    d: ["Estructurados", "Semiestructurados", "No estructurados"],
    e: "Estructurados: esquema fijo en filas y columnas (tablas, CSV). Semiestructurados: estructura jerárquica que puede variar (JSON, XML). No estructurados: sin estructura definida (imágenes, audio, video, PDF)." },
  { q: "Para cada afirmación, indica si es verdadera.",
    a: [["En los datos estructurados, todas las instancias de una entidad tienen los mismos campos.", 1], ["Un contrato escaneado en PDF es un ejemplo de dato semiestructurado.", 0], ["Los datos semiestructurados pueden incluir listas y objetos anidados.", 1]],
    e: "Los datos estructurados tienen esquema fijo. Un PDF escaneado es la imagen de un documento: dato <b>no estructurado</b>. JSON y XML admiten listas y objetos anidados." },
  { q: "Un sistema recibe lecturas de sensores. Todas incluyen <code>deviceId</code> y <code>timestamp</code>, pero según el modelo del sensor pueden incluir temperatura, humedad o un arreglo de lecturas. ¿Qué afirmación es correcta?",
    o: ["Son semiestructurados, porque la estructura varía entre instancias", "Son estructurados, porque todos los registros comparten deviceId y timestamp", "Son no estructurados, porque no tienen un esquema fijo", "Solo pueden guardarse en una base de datos relacional normalizada"], c: 0,
    e: "Compartir algunos campos no basta para ser estructurado: si cada instancia puede tener campos distintos, los datos son <b>semiestructurados</b>. «No estructurado» se reserva para datos sin estructura, como audio o imágenes." },
  { q: "En un modelo de datos, un cliente es una ___ y su dirección de correo electrónico es uno de sus atributos.",
    o: ["entidad", "columna", "clave foránea", "partición"], c: 0,
    e: "Las <b>entidades</b> son objetos del mundo real (cliente, producto). Los <b>atributos</b> son sus características (nombre, correo)." }
]);

T(1, "Formatos de archivo", 4, [
  { q: "Necesitas un formato de archivo para un data lake que comprima bien y permita leer solo las columnas que usa cada consulta analítica. Es el estándar de los lakehouses. ¿Qué formato eliges?",
    o: ["Parquet", "Avro", "CSV", "JSON"], c: 0, g: "fmt-col",
    e: "<b>Parquet</b> es columnar: agrupa los datos por columna, comprime de forma eficiente y lee solo las columnas necesarias. Avro es por filas." },
  { q: "¿Qué formato es orientado a filas, guarda el esquema en un encabezado JSON y los datos en binario por bloques, y es adecuado para serializar y transmitir registros?",
    o: ["Avro", "Parquet", "ORC", "XML"], c: 0,
    e: "<b>Avro</b> (Apache) es orientado a filas: encabezado JSON con el esquema y datos binarios. Bueno para escribir registro a registro y para streaming." },
  { q: "¿Qué dos formatos almacenan los datos por columnas? Selecciona dos.",

T(1, "Bases de datos y NoSQL", 4, [
  { q: "Relaciona cada escenario con el tipo de base de datos NoSQL más adecuado.",
    pares: [["Red social: amigos de amigos y recomendaciones por conexiones", "Grafos"], ["Caché de sesiones de usuario recuperadas por su ID", "Clave-valor"], ["Catálogo de productos con atributos variables, consultado por sus campos", "Documentos"], ["Datos dispersos con columnas agrupadas por afinidad, al estilo de Cassandra", "Familias de columnas"]],
    d: ["Clave-valor", "Documentos", "Familias de columnas", "Grafos"],
    e: "Clave-valor: acceso por clave única. Documentos: el valor es un documento (JSON) consultable por campos. Familias de columnas: columnas agrupadas. Grafos: nodos y aristas, ideales cuando importan las relaciones." },
  { q: "En una base de datos de grafos, ¿cómo se representan las relaciones entre entidades?",

  { q: "Para cada afirmación, indica si es verdadera.",
    a: [["NoSQL es un lenguaje de consulta estándar, igual que SQL.", 0], ["En una base de datos de documentos, dos documentos de la misma colección pueden tener campos distintos.", 1], ["Las bases de datos relacionales usan claves foráneas para relacionar tablas.", 1]],

T(1, "OLTP y ACID", 4, [
  { q: "Relaciona cada situación con la propiedad ACID que la garantiza.",
    pares: [["Una transferencia bancaria se ejecuta completa o no se ejecuta", "Atomicidad"], ["Tras la confirmación (commit), el cambio persiste aunque el servidor se reinicie", "Durabilidad"], ["Dos transacciones concurrentes no ven los cambios intermedios de la otra", "Aislamiento"], ["La base de datos pasa de un estado válido a otro válido, sin violar reglas", "Consistencia"]],
    d: ["Atomicidad", "Consistencia", "Aislamiento", "Durabilidad"], g: "acid",
    e: "<b>A</b>tomicidad: todo o nada. <b>C</b>onsistencia: de un estado válido a otro. A<b>i</b>slamiento: las transacciones concurrentes no interfieren. <b>D</b>urabilidad: lo confirmado persiste aunque el sistema falle." },
  { q: "Durante una transferencia, el sistema falla después de debitar la cuenta A y antes de acreditar la cuenta B. Al reiniciar, el débito se revierte. ¿Qué propiedad ACID lo garantiza?",
    o: ["Atomicidad", "Durabilidad", "Aislamiento", "Consistencia"], c: 0, g: "acid",
    e: "La <b>atomicidad</b> garantiza que la transacción se ejecuta completa o no se ejecuta: un débito sin su crédito se deshace." },
  { q: "Una transacción lee datos que otra transacción modificó pero todavía no ha confirmado. ¿Qué propiedad ACID se está incumpliendo?",
    o: ["Aislamiento", "Atomicidad", "Durabilidad", "Consistencia"], c: 0, g: "acid",
    e: "El <b>aislamiento</b> evita que las transacciones concurrentes interfieran entre sí, por ejemplo leyendo cambios no confirmados." },
  { q: "Un sistema de punto de venta registra miles de ventas por minuto y cada venta actualiza el inventario. ¿Qué tipo de carga de trabajo es?",
    o: ["OLTP (procesamiento transaccional)", "Analítica (OLAP)", "Procesamiento por lotes nocturno", "Data warehouse"], c: 0,
    e: "Muchas transacciones pequeñas, concurrentes y de lectura y escritura (CRUD) = <b>OLTP</b>." },
  { q: "Para cada afirmación, indica si es verdadera.",
    a: [["Los sistemas OLTP trabajan normalmente con datos históricos agregados.", 0], ["Las cargas analíticas son, en su mayoría, de solo lectura.", 1], ["Las cargas OLTP se caracterizan por muchas consultas pequeñas y concurrentes.", 1]],
    e: "OLTP: datos actuales y operativos, muchas operaciones pequeñas de lectura y escritura. Analítico: datos históricos y agregados, lectura mayoritaria, pocas consultas grandes." },
  { q: "Un informe necesita las ventas totales por región y mes de los últimos cinco años. ¿Dónde conviene ejecutar esta consulta?",
    o: ["En un sistema analítico, como un data warehouse o un modelo semántico", "Directamente en la base de datos OLTP de ventas, que ya tiene todos los datos", "En un recurso compartido de Azure Files montado por SMB", "En una caché clave-valor que guarda las sesiones de usuario"], c: 0,
    e: "Las consultas grandes sobre datos históricos y agregados son propias de los sistemas <b>analíticos</b>. Ejecutarlas sobre el OLTP afectaría a las transacciones." },
  { q: "¿Qué significa CRUD en el contexto de los sistemas OLTP?",
    o: ["Crear, leer, actualizar y eliminar registros", "Comprimir, replicar, unir y distribuir datos", "Cargar, revisar, unificar y depurar datos", "Consultar, resumir, unir y desnormalizar tablas"], c: 0,
    e: "Las BD OLTP están optimizadas para operaciones <b>CRUD</b> rápidas sobre registros individuales." }
]);

    o: ["Minimizar la duplicación de datos y asegurar su integridad", "Acelerar las consultas analíticas duplicando datos a propósito", "Eliminar la necesidad de definir claves principales", "Permitir que cada fila de una tabla tenga columnas distintas"], c: 0,
    e: "La normalización <b>minimiza la duplicación</b> y <b>asegura la integridad</b>. Duplicar a propósito es desnormalizar, algo típico de los data warehouses." },
  { q: "Para cada afirmación, indica si es verdadera.",
    a: [["En un esquema normalizado, cambiar la dirección de un cliente requiere modificar una sola fila.", 1], ["La normalización recomienda guardar calle y ciudad en la misma columna para simplificar.", 0], ["Cada entidad debe tener su propia tabla.", 1]],
    e: "Normalizar: cada entidad en su tabla, cada atributo discreto en su columna, clave principal por fila y claves foráneas entre entidades relacionadas." },
  { q: "En la tabla LineItem, la clave principal está formada por la combinación de OrderNo e ItemNo. ¿Cómo se llama este tipo de clave?",
    o: ["Clave compuesta", "Clave foránea", "Clave de partición", "Clave alternativa"], c: 0,
    e: "Una <b>clave compuesta</b> es una combinación única de varias columnas." },
  { q: "Intentas insertar un pedido con CustomerID = 999, pero no existe ningún cliente con ese ID. El RDBMS rechaza la inserción. ¿Qué regla se está aplicando?",
    o: ["Integridad referencial", "Normalización", "Atomicidad", "Desnormalización"], c: 0,
    e: "La <b>integridad referencial</b> impide que una clave foránea apunte a una clave principal inexistente." },
  { q: "La tabla Order tiene una columna Customer que almacena el ID de la tabla Customer. ¿Qué es esa columna dentro de Order?",
    o: ["Una clave foránea", "Una clave principal", "Un índice", "Una clave compuesta"], c: 0,
    e: "Una <b>clave foránea (FK)</b> guarda la clave principal de la entidad relacionada." },
  { q: "Una hoja de cálculo de pedidos repite el nombre y la dirección del cliente en cada línea y guarda calle y ciudad en la misma celda. ¿Qué dos cambios aplicarías al normalizarla? Selecciona dos.",
    o: ["Mover los clientes a su propia tabla y referenciarlos con una clave foránea", "Separar calle y ciudad en columnas distintas", "Agregar más columnas de producto a cada fila del pedido", "Quitar la clave principal de la tabla de pedidos", "Guardar cada pedido completo como un documento JSON"], c: [0, 1],
    e: "Cada entidad en su tabla (Customer), relacionada por FK, y cada atributo discreto en su propia columna." },
  { q: "¿Qué afirmación sobre las claves principales es correcta?",
    o: ["Identifican de forma única cada fila; toda tabla debería tener una, aunque SQL no lo exige", "SQL obliga a definir una clave principal en cada tabla que se crea", "Su valor puede repetirse cuando la tabla tiene muchas filas", "Solo pueden definirse en tablas que también tienen claves foráneas"], c: 0,
    e: "La clave principal identifica cada fila. Toda tabla <b>debería</b> tener una, pero SQL no lo exige." },
  { q: "Un cliente no tiene segundo nombre y la columna MiddleName admite valores vacíos. ¿Qué valor queda en esa columna?",
    o: ["NULL", "0", "La cadena 'N/A', que es obligatoria", "Ninguno: la fila no se puede insertar"], c: 0,
    e: "<b>NULL</b> representa la ausencia de valor en una columna que lo permite." },
  { q: "¿Qué ventaja de granularidad aporta la normalización?",
    o: ["Permite filtrar fácilmente, por ejemplo, los clientes de una ciudad concreta", "Reduce todas las entidades del sistema a una sola tabla ancha", "Permite guardar varios valores separados por comas en una misma celda", "Elimina la necesidad de definir tipos de datos en cada columna"], c: 0,
    e: "Con cada atributo en su propia columna (por ejemplo, City), es sencillo filtrar y agrupar." }
]);

T(2, "Instrucciones SQL", 10, [
  { q: "Clasifica cada instrucción SQL.",
    pares: [["CREATE", "DDL"], ["ALTER", "DDL"], ["DROP", "DDL"], ["GRANT", "DCL"], ["REVOKE", "DCL"], ["SELECT", "DML"], ["UPDATE", "DML"], ["DELETE", "DML"]],
    d: ["DDL", "DCL", "DML"], h: 9,
    e: "DDL = definición (estructura): CREATE, ALTER, DROP, RENAME. DCL = control (permisos): GRANT, DENY, REVOKE. DML = manipulación (datos): SELECT, INSERT, UPDATE, DELETE." },
  { q: "Un compañero ejecuta <code>DELETE FROM Customer;</code> sin cláusula WHERE. ¿Qué ocurre?",
    o: ["Se eliminan todas las filas, pero la tabla sigue existiendo", "Se elimina la tabla completa, incluidas su estructura y sus filas", "SQL pide confirmación antes de borrar las filas afectadas", "Se produce un error porque DELETE exige una cláusula WHERE"], c: 0, g: "del-drop",
    e: "Sin WHERE, DELETE afecta a <b>todas</b> las filas y SQL no pide confirmación. La tabla sigue existiendo; para quitarla se usa DROP (DDL)." },
  { q: "¿Qué instrucción elimina por completo la tabla Product, incluida su estructura?",
    o: ["DROP TABLE Product;", "DELETE FROM Product;", "REVOKE ALL ON Product;", "ALTER TABLE Product DELETE;"], c: 0, g: "del-drop",
    e: "<b>DROP</b> (DDL) quita el objeto y todas sus filas. DELETE (DML) solo elimina filas." },
  { q: "Necesitas impedir explícitamente que user2 lea la tabla Salary, aunque pertenezca a un grupo que tiene permiso de lectura. ¿Qué instrucción usas?",
    o: ["DENY", "REVOKE", "DROP", "ALTER"], c: 0,
    e: "<b>DENY</b> deniega el permiso. <b>REVOKE</b> solo quita un permiso concedido antes; el usuario podría seguir leyendo gracias a su grupo." },
  { q: "Relaciona cada sistema con su dialecto de SQL.",
    pares: [["Azure SQL Database", "T-SQL"], ["Azure SQL Managed Instance", "T-SQL"], ["SQL Server en una VM de Azure", "T-SQL"], ["PostgreSQL", "pgSQL"], ["Oracle", "PL/SQL"]],
    d: ["T-SQL", "pgSQL", "PL/SQL"], h: 9,
    e: "T-SQL: toda la familia SQL Server. pgSQL (PL/pgSQL): PostgreSQL. PL/SQL: Oracle." },
  { q: "Completa la consulta para obtener solo los clientes de Seattle:<pre>SELECT FirstName, LastName\nFROM Customer\n___ City = 'Seattle'\nORDER BY LastName;</pre>",
    o: ["WHERE", "ON", "SET", "VALUES"], c: 0,
    e: "La cláusula <b>WHERE</b> filtra las filas. ON se usa en JOIN, SET en UPDATE y VALUES en INSERT." },
  { q: "Completa la instrucción:<pre>UPDATE Customer\n___ Address = '123 High St.'\nWHERE ID = 1;</pre>",
    o: ["SET", "VALUES", "INTO", "ON"], c: 0,
    e: "Sintaxis: <code>UPDATE tabla SET columna = valor WHERE ...</code>" },
  { q: "Completa la instrucción:<pre>INSERT INTO Product(ID, Name, Price)\n___ (99, 'Drill', 4.99);</pre>",
    o: ["VALUES", "SET", "WHERE", "FROM"], c: 0,
    e: "Sintaxis: <code>INSERT INTO tabla(columnas) VALUES (...)</code>" },
  { q: "Ejecutas una consulta SELECT sin ORDER BY. ¿En qué orden se devuelven las filas?",
    o: ["En ningún orden garantizado", "Siempre ordenadas por la clave principal", "Siempre en el orden en que se insertaron", "Alfabéticamente por la primera columna"], c: 0,
    e: "Sin <b>ORDER BY</b>, las filas no salen en ningún orden garantizado." },
  { q: "Observa la consulta:<pre>SELECT o.OrderNo, c.City\nFROM [Order] AS o\nJOIN Customer AS c\nON o.Customer = c.ID;</pre>¿Qué afirmación es correcta?",
    o: ["La condición empareja la clave foránea de Order con la clave principal de Customer; o y c son alias", "Combina cada fila de Order con todas las filas de Customer, sin ninguna condición", "o y c son nombres de esquemas de la base de datos donde viven las tablas", "Devuelve únicamente los clientes que todavía no tienen ningún pedido"], c: 0,
    e: "El JOIN suele emparejar una <b>FK</b> con su <b>PK</b>; <code>o</code> y <code>c</code> son alias de tabla." },
  { q: "Para cada afirmación, indica si es verdadera.",
    a: [["SQL fue estandarizado por ANSI en 1986 y por ISO en 1987.", 1], ["Los dialectos existen porque cada proveedor agrega extensiones propietarias.", 1], ["Un UPDATE sin WHERE solo modifica la primera fila de la tabla.", 0]], h: 9,
    e: "ANSI 1986 e ISO 1987. Los dialectos (T-SQL, pgSQL, PL/SQL) agregan extensiones. Un UPDATE sin WHERE modifica <b>todas</b> las filas." },
  { q: "¿Por qué, en una base de datos real, una tabla llamada Order suele escribirse como <code>[Order]</code>?",
    o: ["Porque ORDER es una palabra reservada de SQL", "Porque se trata de una vista y no de una tabla", "Porque es una tabla temporal de la sesión", "Porque los corchetes indican la clave principal"], c: 0,
    e: "<code>ORDER</code> es palabra reservada (ORDER BY); en T-SQL se delimita con corchetes." },
  { q: "Dada esta tabla:<pre>CREATE TABLE Product\n(\n    ID    INT PRIMARY KEY,\n    Name  VARCHAR(20) NOT NULL,\n    Price DECIMAL NULL\n);</pre>¿Qué inserción fallará?",
    o: ["INSERT INTO Product(ID, Price) VALUES (1, 9.99);", "INSERT INTO Product(ID, Name) VALUES (2, 'Saw');", "INSERT INTO Product(ID, Name, Price) VALUES (3, 'Nail', NULL);", "INSERT INTO Product(ID, Name, Price) VALUES (4, 'Hammer', 2.99);"], c: 0,
    e: "<code>Name</code> es <b>NOT NULL</b>: la primera inserción no le da valor y falla. Price admite NULL, así que las demás funcionan." },
  { q: "¿Qué dos instrucciones pertenecen al lenguaje de manipulación de datos (DML)? Selecciona dos.",
    o: ["INSERT", "SELECT", "GRANT", "ALTER", "RENAME"], c: [0, 1], h: 9,
    e: "DML: SELECT, INSERT, UPDATE, DELETE. GRANT es DCL; ALTER y RENAME son DDL." },
  { q: "Un DBA quiere que user1 pueda leer, insertar y modificar datos de la tabla Product. ¿Qué instrucción usa?",
    o: ["GRANT SELECT, INSERT, UPDATE ON Product TO user1;", "DENY SELECT, INSERT, UPDATE ON Product TO user1;", "ALTER TABLE Product ADD user1;", "REVOKE SELECT, INSERT, UPDATE ON Product FROM user1;"], c: 0,
    e: "<b>GRANT</b> concede permisos (DCL)." },
  { q: "¿Qué instrucción usarías para añadir una columna Email a una tabla existente?",
    o: ["ALTER", "UPDATE", "INSERT", "GRANT"], c: 0,
    e: "<b>ALTER</b> (DDL) modifica la estructura de un objeto. UPDATE modifica valores de filas existentes." },
  { q: "¿Qué afirmación sobre INSERT en SQL estándar es correcta?",
    o: ["Inserta una fila a la vez, aunque algunos dialectos permiten varias listas de VALUES", "Siempre inserta todas las filas de otra tabla indicada en la cláusula FROM", "Requiere una cláusula WHERE para indicar en qué posición insertar la fila", "Solo puede usarse en tablas que no tienen definida una clave principal"], c: 0,
    e: "El SQL estándar inserta <b>una fila a la vez</b>; algunos dialectos permiten varias listas de VALUES." }
]);

T(2, "Objetos de base de datos", 11, [
  { q: "Relaciona cada descripción con el objeto de base de datos.",
    pares: [["Consulta guardada que se usa como tabla virtual", "Vista"], ["Código SQL guardado que acepta parámetros y se ejecuta a petición", "Procedimiento almacenado"], ["Estructura de árbol que acelera las búsquedas por una columna", "Índice"], ["Código que se ejecuta automáticamente ante un evento", "Desencadenador (trigger)"]],
    e: "Vista: tabla virtual basada en un SELECT. Procedimiento: SQL con parámetros que se ejecuta con EXEC. Índice: árbol ordenado para buscar rápido. Trigger: se ejecuta solo ante un evento." },
  { q: "Los usuarios ejecutan a diario una consulta compleja que combina Order y Customer para ver las entregas. Quieres que puedan consultarla y filtrarla como si fuera una tabla, sin duplicar datos. ¿Qué creas?",
    o: ["Una vista", "Un índice", "Una tabla nueva con los datos copiados", "Una clave compuesta"], c: 0,
    e: "Una <b>vista</b> es una tabla virtual basada en un SELECT; se consulta y filtra como una tabla." },
  { q: "Una aplicación debe renombrar productos y quieres encapsular esa lógica en la base de datos, recibiendo el ID y el nuevo nombre como parámetros. ¿Qué objeto creas?",
    o: ["Un procedimiento almacenado", "Una vista", "Un índice", "Una clave foránea"], c: 0,
    e: "Un <b>procedimiento almacenado</b> encapsula lógica y acepta parámetros." },
  { q: "¿Cómo se ejecuta en T-SQL el procedimiento almacenado RenameProduct?",
    o: ["EXEC RenameProduct 201, 'Spanner';", "SELECT * FROM RenameProduct;", "CREATE VIEW RenameProduct;", "CREATE INDEX RenameProduct;"], c: 0,
    e: "Los procedimientos se ejecutan con <b>EXEC</b>." },
  { q: "Una tabla de 20 filas tiene un índice sobre la columna Name. ¿Qué es lo más probable al consultar filtrando por Name?",
    o: ["El optimizador ignora el índice y lee la tabla completa", "El índice hace la consulta 20 veces más rápida", "La consulta falla porque la tabla es demasiado pequeña", "El índice se elimina automáticamente"], c: 0,
    e: "En tablas con <b>pocas filas</b> el índice no aporta y el optimizador lee la tabla completa." },
  { q: "¿Qué dos afirmaciones sobre los índices son correctas? Selecciona dos.",
    o: ["Ocupan almacenamiento adicional", "Hacen más lentas las operaciones INSERT, UPDATE y DELETE", "Una tabla solo puede tener un índice", "Siempre mejoran el rendimiento sin ningún costo", "Sustituyen a la clave principal"], c: [0, 1],
    e: "Los índices aceleran las lecturas, pero ocupan espacio y hay que mantenerlos en cada escritura. Una tabla puede tener varios." },
  { q: "Para cada afirmación, indica si es verdadera.",
    a: [["Una vista puede combinar filas de varias tablas.", 1], ["Un procedimiento almacenado puede recibir parámetros.", 1], ["Un índice acelera las escrituras porque mantiene los datos ordenados.", 0]],
    e: "Las vistas pueden usar JOIN y los procedimientos aceptan parámetros. Los índices aceleran las <b>lecturas</b> y ralentizan las escrituras." },
  { q: "¿Qué componente decide si una consulta usa un índice o recorre la tabla completa?",
    o: ["El optimizador de consultas", "El servidor lógico", "Data Migration Assistant", "El desencadenador"], c: 0,
    e: "El <b>optimizador de consultas</b> decide cómo ejecutar cada consulta." },
  { q: "Una tabla de pedidos tiene millones de filas y recibe muchas inserciones por segundo, pero rara vez se consulta. Alguien propone crear índices en diez columnas. ¿Cuál es el principal riesgo?",
    o: ["Las inserciones serán más lentas y se usará más almacenamiento", "Las consultas de lectura serán más lentas", "Se perderá la integridad referencial con otras tablas", "La tabla dejará de admitir valores NULL"], c: 0,
    e: "Cada índice se actualiza en cada escritura: hay que equilibrar la velocidad de las consultas con el costo de las escrituras." },
  { q: "Completa la instrucción para crear un índice sobre la columna Name:<pre>___ idx_ProductName\nON Product(Name);</pre>",
    o: ["CREATE INDEX", "CREATE VIEW", "CREATE PROCEDURE", "ALTER TABLE"], c: 0,
    e: "<code>CREATE INDEX nombre ON tabla(columna);</code>" }
]);

T(2, "Familia Azure SQL", 12, [
  { q: "Relaciona cada escenario con la opción de Azure SQL más adecuada.",
    pares: [["Migrar SQL Server con Agente SQL y consultas entre BD, con cambios mínimos y sin administrar el SO", "SQL Managed Instance"], ["App nueva en la nube con una sola BD, bajo costo y mínima administración", "Azure SQL Database (base única)"], ["La aplicación necesita acceso al sistema operativo del servidor", "SQL Server en VM"], ["Varias BD con picos de uso en momentos distintos que comparten presupuesto", "Azure SQL Database (grupo elástico)"]], h: 28,
    e: "Managed Instance: compatibilidad de instancia. SQL Database: apps nuevas con mínima administración; grupo elástico para cargas variables. VM: control total del SO." },
  { q: "¿Qué opción de Azure SQL ofrece el SLA de disponibilidad más alto (99,995 %)?",
    o: ["Azure SQL Database", "Azure SQL Managed Instance", "SQL Server en una VM de Azure", "Las tres ofrecen 99,995 %"], c: 0,
    e: "Azure SQL Database: 99,995 %. Managed Instance y SQL Server en VM: 99,99 %." },
  { q: "Tu empresa quiere migrar a Azure una instancia de SQL Server que usa características avanzadas a nivel de instancia, sin tener que administrar una máquina virtual. ¿Qué servicio eliges?",
    o: ["Azure SQL Managed Instance", "SQL Server en una VM de Azure", "Azure SQL Database (base única)", "Azure Database for PostgreSQL"], c: 0, g: "mi",
    e: "<b>Managed Instance</b>: compatibilidad casi total con SQL Server (Enterprise Edition) y PaaS; ideal para lift-and-shift sin administrar una VM." },
  { q: "Una aplicación local depende del Agente SQL Server y de consultas entre bases de datos de la misma instancia. Quieres un servicio PaaS. ¿Cuál eliges?",
    o: ["Azure SQL Managed Instance", "Azure SQL Database (base única)", "SQL Server en una VM de Azure", "Azure Cosmos DB for NoSQL"], c: 0, g: "mi", h: 28,
    e: "Si piden compatibilidad de instancia (Agente SQL, varias BD) y PaaS, es <b>Managed Instance</b>. La VM es IaaS." },
  { q: "¿Qué herramienta detecta problemas de compatibilidad que podrían bloquear una migración a Azure SQL Database o Managed Instance?",
    o: ["Data Migration Assistant (DMA)", "Azure File Sync", "AzCopy", "Microsoft Purview"], c: 0,

  { q: "Necesitas una base de datos de Azure SQL de unos 80 TB con escalado rápido y copias de seguridad y restauración rápidas. ¿Qué opción eliges?",
    o: ["Azure SQL Database Hiperescala", "Un grupo elástico de Azure SQL Database", "Azure SQL Database sin servidor", "Azure Files con nivel SSD"], c: 0,
    e: "<b>Hiperescala</b>: BD de hasta 100 TB, escalado rápido y respaldo y restauración rápidos." },
  { q: "Una base de datos de desarrollo se usa unas pocas horas al día de forma impredecible. Quieres que los recursos se escalen solos según la demanda. ¿Qué modelo de Azure SQL Database eliges?",
    o: ["Sin servidor (serverless)", "Recursos preasignados con cobro por hora", "Hiperescala", "SQL Server en una VM"], c: 0,
    e: "<b>Sin servidor</b>: escala sola y asigna recursos según la demanda." },
  { q: "¿Qué es un servidor lógico en Azure SQL Database?",
    o: ["El punto central de inicios de sesión, firewall, auditoría y conmutación por error de varias bases de datos", "Una máquina virtual con SQL Server instalado, cuyo sistema operativo y parches administra el cliente", "Un conjunto de bases de datos con uso variable que comparten recursos de cómputo para reducir costos", "Un tipo de índice especial que acelera las consultas que combinan tablas de varias bases de datos"], c: 0,
    e: "El <b>servidor lógico</b> es el punto central de administración donde se crean las BD de Azure SQL Database." },
  { q: "Para cada afirmación, indica si es verdadera.",
    a: [["En SQL Server en una VM de Azure, tú administras el SO, las actualizaciones y las copias de seguridad.", 1], ["Azure SQL Managed Instance automatiza las copias de seguridad y los parches.", 1], ["Azure SQL Database es 100 % compatible con todas las características de SQL Server local.", 0]],
    e: "En la VM (IaaS) administras todo. MI y SQL Database automatizan respaldos y parches. SQL Database solo incluye las funciones principales." },
  { q: "¿Qué dos situaciones justifican elegir SQL Server en una VM de Azure? Selecciona dos.",
    o: ["La aplicación necesita funciones del sistema operativo que no están disponibles en PaaS", "Se requiere control total sobre la versión de SQL Server y el sistema operativo", "Se busca la menor administración posible", "Se necesita el SLA de disponibilidad del 99,995 %", "Se quiere pagar solo por uso con escalado automático"], c: [0, 1],
    e: "La VM (IaaS) da control total del SO y del DBMS, pero implica administrarlo todo." },
  { q: "¿Qué tipos de inicio de sesión admite Azure SQL Managed Instance?",
    o: ["Inicios de sesión de SQL Server y de Microsoft Entra ID", "Solo Microsoft Entra ID con autenticación multifactor", "Solo inicios de sesión de SQL Server con contraseña", "Solo certificados de cliente y claves de acceso compartidas"], c: 0,
    e: "MI admite inicios de sesión de <b>SQL Server</b> (usuario y contraseña) y de <b>Microsoft Entra ID</b>." },
  { q: "¿Qué tres ventajas ofrece Azure SQL Database? Selecciona tres.",

    e: "SQL Database ofrece restauración a un momento dado, Advanced Threat Protection, replicación entre regiones, auditoría y cifrado. No da acceso al SO ni compatibilidad total." },
  { q: "Una empresa tiene una base de datos de nóminas con mucha carga a fin de mes y otra de informes con carga a mitad de mes. Quiere reducir costos. ¿Qué recomiendas?",
    o: ["Colocar ambas en un grupo elástico de Azure SQL Database", "Crear dos SQL Server en VM separadas", "Usar dos Managed Instance independientes", "Migrarlas a Azure Cosmos DB"], c: 0,
    e: "Un <b>grupo elástico</b> permite que varias BD con cargas variables compartan recursos y reduce costos." },
  { q: "Azure SQL Database registra los eventos de ___ en una cuenta de Azure Storage, lo que ayuda al cumplimiento normativo.",
    o: ["auditoría", "indexación", "replicación", "rehidratación"], c: 0, h: 13,
    e: "La <b>auditoría</b> registra eventos en una cuenta de Azure Storage." },
  { q: "¿Qué modelo de servicio corresponde a SQL Server en una VM de Azure?",
    o: ["IaaS", "PaaS", "SaaS", "Sin servidor"], c: 0,
    e: "SQL Server en VM es <b>IaaS</b>: Microsoft da la VM y tú administras el resto." },
  { q: "¿Qué afirmación sobre Azure SQL Managed Instance es correcta?",
    o: ["Cada instancia admite varias bases de datos, con un control similar al de un servidor local", "Solo admite una base de datos por instancia, igual que SQL Database", "Requiere que el cliente administre el sistema operativo y los parches", "No admite migraciones desde SQL Server local sin reescribir la aplicación"], c: 0,
    e: "MI es una instancia de SQL Server con <b>varias BD</b>; automatiza el mantenimiento y tú conservas el control de la seguridad y de la asignación de recursos." },
  { q: "Necesitas un entorno de desarrollo y pruebas de SQL Server sin comprar hardware, con la posibilidad de aumentar memoria y CPU sin reinstalar, y con acceso administrativo total al SO. ¿Qué eliges?",
    o: ["SQL Server en una VM de Azure", "Azure SQL Database sin servidor", "Azure SQL Managed Instance", "Azure Database for MySQL"], c: 0,
    e: "La VM permite dev/test sin hardware, escalado vertical y <b>derechos administrativos totales</b> sobre el SO." }
]);

T(2, "MySQL y PostgreSQL", 13, [
  { q: "Una aplicación web en PHP que corre sobre Linux y Apache (pila LAMP) debe migrarse con cambios mínimos a un servicio administrado. ¿Qué servicio eliges?",
    o: ["Azure Database for MySQL", "Azure Database for PostgreSQL", "Azure SQL Managed Instance", "Azure Cosmos DB for MongoDB"], c: 0,
    e: "MySQL es el líder de la pila <b>LAMP</b> (Linux, Apache, MySQL, PHP)." },
  { q: "Una aplicación necesita guardar y consultar datos geométricos (líneas, círculos, polígonos) y tipos de datos personalizados en una base de datos relacional de código abierto. ¿Qué eliges?",
    o: ["Azure Database for PostgreSQL", "Azure Database for MySQL", "Azure Table Storage", "Azure Cosmos DB for Table"], c: 0,
    e: "<b>PostgreSQL</b> es objeto-relacional: admite tipos de datos personalizados y datos geométricos." },
  { q: "Azure Database for MySQL se basa en la edición:",
    o: ["Community", "Enterprise", "Standard", "Cluster"], c: 0,
    e: "Azure Database for MySQL se basa en la edición <b>Community</b> (gratuita)." },
  { q: "¿Hasta cuántos días permite Azure Database for MySQL restaurar a un momento dado?",
    o: ["35 días (7 por defecto)", "7 días como máximo", "90 días (30 por defecto)", "365 días"], c: 0,

T(3, "Niveles de acceso", 15, [
  { q: "Relaciona cada nivel de acceso con su periodo mínimo antes de aplicar la penalización por eliminación anticipada.",

    d: ["Sin mínimo", "30 días", "90 días", "180 días"],
    e: "Hot: sin mínimo. Cool: 30 días. Cold: 90 días. Archive: 180 días." },

    e: "<b>Archive</b> tiene el menor costo de almacenamiento; los datos están sin conexión y la rehidratación puede tardar hasta 15 horas." },
  { q: "Necesitas guardar copias de seguridad a corto plazo que rara vez se usan, pero que deben poder leerse en milisegundos si ocurre un desastre. ¿Qué nivel tiene el menor costo de almacenamiento que cumple el requisito?",
    o: ["Cold", "Archive", "Hot", "Cool"], c: 0,

  { q: "Mueves un blob al nivel Cool y lo eliminas a los 10 días. ¿Qué ocurre?",

  { q: "Para cada afirmación, indica si es verdadera.",

    e: "Hot es el predeterminado. Menor costo de almacenamiento = mayor costo de acceso. Archive solo se asigna por blob, no a la cuenta." },
  { q: "Tras solicitar la rehidratación de un blob en Archive, ¿cuánto puede tardar en estar disponible?",
    o: ["Hasta unas 15 horas", "Unos milisegundos", "Exactamente 30 días", "Es inmediato si la cuenta usa GRS"], c: 0,

T(4, "Lotes y flujos", 24, [
  { q: "Relaciona cada característica con el tipo de procesamiento.",
    pares: [["Procesa todos los datos del conjunto", "Por lotes"], ["Procesa lo más reciente o una ventana de tiempo", "Flujos"], ["Latencia de horas", "Por lotes"], ["Latencia de segundos o milisegundos", "Flujos"], ["Análisis complejo", "Por lotes"], ["Registros individuales o microlotes", "Flujos"]],
    d: ["Por lotes", "Flujos"],

  { q: "¿Cuál es un ejemplo clásico de procesamiento por lotes?",
    o: ["La factura mensual de una tarjeta de crédito", "Un sistema que activa alarmas de incendio por humo y temperatura", "Recomendar propiedades según la ubicación del móvil del cliente", "Rebalancear carteras según la bolsa en tiempo real"], c: 0,

  { q: "¿Qué dos son desventajas del procesamiento por lotes? Selecciona dos.",
    o: ["Hay un retraso entre la entrada de los datos y los resultados", "Un error pequeño puede detener todo el lote", "No puede procesar grandes volúmenes de datos", "No se puede programar en horas de poca carga", "Solo admite agregaciones simples"], c: [0, 1],

  { q: "¿Qué arquitectura combina una capa de lotes y una capa de flujos que funcionan por separado?",
    o: ["Lambda", "Kappa", "Estrella", "Copo de nieve"], c: 0, g: "lambda",

  { q: "En una arquitectura Kappa, ¿cómo se reprocesa el histórico?",
    o: ["Se reproduce el flujo, porque no hay capa de lotes", "Con la capa de lotes, que se ejecuta cada noche", "Restaurando una copia de seguridad del data warehouse", "No se puede reprocesar el histórico"], c: 0, g: "lambda",

  { q: "Un sistema de detección de incendios debe activar alarmas y abrir puertas en cuanto los sensores detectan humo. ¿Qué tipo de procesamiento necesita?",
    o: ["Procesamiento de flujos", "Procesamiento por lotes nocturno", "Procesamiento por lotes mensual", "Una consulta manual al data warehouse"], c: 0,
    e: "Escenario crítico en tiempo → <b>streaming</b>." },
  { q: "Para cada afirmación, indica si es verdadera.",
    a: [["El streaming puede usarse para capturar datos que después se procesan por lotes.", 1], ["En una arquitectura lambda, los resultados del streaming nunca se guardan en el data warehouse.", 0], ["El procesamiento por lotes puede dispararse por horario, por cantidad de datos o por otro evento.", 1]],
    e: "El streaming suele usarse para capturar datos. En lambda, los resultados del streaming también pueden guardarse en el warehouse." },
  { q: "En una solución de tráfico, un panel muestra los autos que pasan en la hora actual y otro informe muestra el tráfico del último año. ¿Qué enfoque se usa?",
    o: ["Combinar flujos (tiempo real) y lotes (histórico)", "Solo procesamiento por lotes", "Solo procesamiento OLTP", "Solo un data lake sin procesamiento"], c: 0,
    e: "Muchas soluciones combinan datos <b>históricos</b> (lotes) y <b>en tiempo real</b> (flujos)." },
  { q: "¿Cuál es otra arquitectura común, además de lambda, que combina lotes y flujos?",
    o: ["Delta", "Estrella", "Copo de nieve", "Normalizada"], c: 0,

]);

  { q: "Para cada afirmación, indica si es verdadera.",
    a: [["Power BI admite objetos visuales personalizados y de terceros.", 1], ["El gráfico circular es el más adecuado para mostrar tendencias en el tiempo.", 0], ["Una tabla es útil para mostrar muchos valores relacionados.", 1]],
    e: "Tendencias en el tiempo → líneas. Circular → proporciones de un total." },
  { q: "Un analista de negocio crea sus propios informes sin ayuda del equipo técnico. ¿Cómo se llama este enfoque?",
    o: ["Autoservicio", "Procesamiento por lotes", "Normalización", "Lift-and-shift"], c: 0,
    e: "<b>Autoservicio</b>: usuarios de negocio que crean sus propios análisis sin ayuda técnica." },
  { q: "¿Qué rol se encarga normalmente de crear paneles e informes en Power BI?",
    o: ["Analista de datos", "Ingeniero de datos", "Administrador de bases de datos", "Administrador de red"], c: 0, h: 29,
    e: "Trampa típica: «crear un panel» es del <b>analista</b>, no del ingeniero." }
]);
