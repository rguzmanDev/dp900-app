<script>
(function () {
  'use strict';

  const PARTES = {
    1: { nombre: 'Conceptos básicos de datos', corto: 'Conceptos básicos', min: 25, max: 30 },
    2: { nombre: 'Datos relacionales en Azure', corto: 'Relacionales', min: 20, max: 25 },
    3: { nombre: 'Datos no relacionales en Azure', corto: 'No relacionales', min: 15, max: 20 },
    4: { nombre: 'Análisis en Azure', corto: 'Análisis', min: 25, max: 30 }
  };
  const NOMBRE_MODO = { sim: 'Simulacro', prac: 'Práctica', err: 'Repaso de errores' };
  const LETRAS = 'ABCDEFGHIJ';
  function resumen(hoja) {
    let pagina = 'resumen.html';
    try { if (localStorage.getItem('dp900-resumen') === 'bn') pagina = 'resumen-bn.html'; } catch (e) {}
    return pagina + (hoja ? '#hoja-' + hoja : '');
  }
  const KEY = 'dp900-cuestionarios-v1';
  const KEY_SES = 'dp900-sesion-v1';
  const APROBADO = 700;
  const TAMANOS = [[50, 45], [40, 36], [25, 23]];

  const app = document.getElementById('app');
  let VISTA = 'inicio';
  let S = null;
  let reloj = null;
  let ULTIMO = null;
  let FILTRO = 'todas';

  /* ── Preparación del banco ─────────────────────────────────── */
  function tipoDe(q) {
    if (q.a) return 'sino';
    if (q.pares) return 'relacionar';
    if (Array.isArray(q.c)) return 'multiple';
    if (q.q.indexOf('___') >= 0) return 'completar';
    return 'unica';
  }
  function hash(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  const usados = new Set();
  BANCO.forEach(q => {
    q.tipo = tipoDe(q);
    const firma = q.q + '|' + (q.o || []).join('|') + (q.a || []).map(x => x[0]).join('|') + (q.pares || []).map(x => x[0]).join('|');
    let id = 'q' + hash(firma);
    while (usados.has(id)) id += 'x';
    usados.add(id);
    q.id = id;
    if (q.tipo === 'relacionar') {
      q.dest = q.d ? q.d.slice() : Array.from(new Set(q.pares.map(p => p[1]))).sort((a, b) => a.localeCompare(b, 'es'));
    }
  });
  const POR_ID = {};
  BANCO.forEach(q => { POR_ID[q.id] = q; });

  const TEMAS = [];
  (function () {
    const m = new Map();
    BANCO.forEach(q => {
      const k = q.p + '|' + q.t;
      if (!m.has(k)) m.set(k, { p: q.p, t: q.t, h: q.h, n: 0 });
      const o = m.get(k);
      o.n++;
      o.h = Math.min(o.h, q.h);
    });
    m.forEach(v => TEMAS.push(v));
  })();

  function validar() {
    const errs = [];
    BANCO.forEach(q => {
      const ref = q.q.slice(0, 70);
      if (!q.e) errs.push('Sin explicación: ' + ref);
      if (q.tipo === 'unica' || q.tipo === 'completar') {
        if (!q.o || typeof q.c !== 'number' || q.c < 0 || q.c >= q.o.length) errs.push('Respuesta fuera de rango: ' + ref);
      }
      if (q.tipo === 'completar' && q.q.split('___').length !== 2) errs.push('Debe tener exactamente un hueco: ' + ref);
      if (q.tipo === 'multiple' && (q.c.length < 2 || q.c.some(i => i < 0 || i >= q.o.length))) errs.push('Respuestas múltiples inválidas: ' + ref);
      if (q.tipo === 'relacionar') q.pares.forEach(p => { if (q.dest.indexOf(p[1]) < 0) errs.push('Destino inexistente «' + p[1] + '»: ' + ref); });
    });
    if (errs.length) console.warn('Problemas en el banco de preguntas:\n' + errs.join('\n'));
    return errs;
  }
  window.validarBanco = validar;
  validar();

  /* ── Persistencia ──────────────────────────────────────────── */
  function cargarDB() {
    const base = { stats: {}, errores: {}, historial: [], ultimoTam: TAMANOS[0] };
    try { return Object.assign(base, JSON.parse(localStorage.getItem(KEY)) || {}); }
    catch (e) { return base; }
  }
  let DB = cargarDB();
  function guardar() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { /* almacenamiento no disponible */ } }

  function registrar(q, ok) {
    const s = DB.stats[q.id] || { v: 0, a: 0 };
    s.v++;
    if (ok) s.a++;
    s.u = ok ? 1 : 0;
    DB.stats[q.id] = s;
    if (!ok) DB.errores[q.id] = 0;
    else if (q.id in DB.errores) {
      DB.errores[q.id]++;
      if (DB.errores[q.id] >= 2) delete DB.errores[q.id];
    }
  }
  function contarErrores() { return Object.keys(DB.errores).filter(id => POR_ID[id]).length; }

  function guardarSesion() {
    try {
      if (!S || S.terminada) { localStorage.removeItem(KEY_SES); return; }
      const data = Object.assign({}, S, {
        items: S.items.map(it => ({ id: it.id, orden: it.orden, resp: it.resp, comprobada: it.comprobada, marcada: it.marcada, puntos: it.puntos }))
      });
      localStorage.setItem(KEY_SES, JSON.stringify(data));
    } catch (e) { /* almacenamiento no disponible */ }
  }
  function cargarSesion() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY_SES));
      if (!d || !d.items) return null;
      d.items = d.items.filter(x => POR_ID[x.id]).map(x => {
        const q = POR_ID[x.id];
        if (!x.orden || x.orden.length !== largo(q)) return instanciar(q);
        return Object.assign(x, { q: q });
      });
      return d.items.length ? d : null;
    } catch (e) { return null; }
  }

  /* ── Utilidades ────────────────────────────────────────────── */
  function barajar(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(x) { return Math.round(x * 100); }
  function fmtTiempo(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function fmtFecha(t) { return new Date(t).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function largo(q) { return (q.o || q.a || q.pares).length; }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('vis');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('vis'), 2600);
  }

  /* ── Selección de preguntas ────────────────────────────────── */
  function seleccionarDiverso(pool, n) {
    const porTema = {};
    barajar(pool).forEach(q => { (porTema[q.t] = porTema[q.t] || []).push(q); });
    const temas = barajar(Object.keys(porTema));
    const out = [];
    const grupos = new Set();
    let avance = true;
    while (out.length < n && avance) {
      avance = false;
      for (const t of temas) {
        if (out.length >= n) break;
        const lista = porTema[t];
        while (lista.length) {
          const q = lista.shift();
          if (q.g && grupos.has(q.g)) continue;
          if (q.g) grupos.add(q.g);
          out.push(q);
          avance = true;
          break;
        }
      }
    }
    return out;
  }
  function sinGruposRepetidos(lista) {
    const grupos = new Set();
    return lista.filter(q => {
      if (!q.g) return true;
      if (grupos.has(q.g)) return false;
      grupos.add(q.g);
      return true;
    });
  }
  function repartoSimulacro(n) {
    const fueraDeRango = p => {
      const pct = pesos[p] / total * 100;
      return pct < PARTES[p].min || pct > PARTES[p].max;
    };
    let pesos, total, intentos = 0;
    do {
      pesos = {};
      total = 0;
      Object.keys(PARTES).forEach(p => {
        pesos[p] = PARTES[p].min + Math.random() * (PARTES[p].max - PARTES[p].min);
        total += pesos[p];
      });
    } while (++intentos < 500 && Object.keys(PARTES).some(fueraDeRango));
    const cuotas = {};
    const restos = [];
    let asignado = 0;
    Object.keys(pesos).forEach(p => {
      const exacto = pesos[p] / total * n;
      cuotas[p] = Math.floor(exacto);
      asignado += cuotas[p];
      restos.push([p, exacto - cuotas[p]]);
    });
    restos.sort((a, b) => b[1] - a[1]);
    for (let i = 0; asignado < n; i++, asignado++) cuotas[restos[i % restos.length][0]]++;
    return cuotas;
  }
  function prioridad(q) {
    const s = DB.stats[q.id];
    let base;
    if (!s) base = 0;
    else if (q.id in DB.errores) base = 0.5;
    else base = 1 + s.a / s.v;
    return base + Math.random() * 0.5;
  }

  /* ── Sesiones ──────────────────────────────────────────────── */
  function instanciar(q) {
    const it = { id: q.id, q: q, comprobada: false, marcada: false, puntos: null };
    it.orden = barajar(Array.from({ length: largo(q) }, (_, i) => i));
    if (q.tipo === 'unica' || q.tipo === 'completar') it.resp = null;
    else if (q.tipo === 'multiple') it.resp = [];
    else if (q.tipo === 'sino') it.resp = q.a.map(() => null);
    else it.resp = q.pares.map(() => -1);
    return it;
  }
  function hayOtraSesion() {
    const ses = cargarSesion();
    return ses && !ses.terminada && !confirm('Tienes una sesión en curso. ¿Descartarla y empezar otra?');
  }
  function iniciarSesion(modo, preguntas, minutos) {
    if (!preguntas.length) { toast('No hay preguntas para esa selección.'); return; }
    S = {
      modo: modo,
      items: preguntas.map(instanciar),
      idx: 0,
      inicio: Date.now(),
      finEn: minutos ? Date.now() + minutos * 60000 : null,
      terminada: false
    };
    guardarSesion();
    vistaQuiz(true);
  }
  function crearSimulacro(n, minutos) {
    const cuotas = repartoSimulacro(n);
    let preguntas = [];
    Object.keys(cuotas).forEach(p => {
      preguntas = preguntas.concat(seleccionarDiverso(BANCO.filter(q => q.p === +p), cuotas[p]));
    });
    iniciarSesion('sim', barajar(preguntas), minutos);
  }
  function crearPractica(temas, cantidad, priorizar) {
    let pool = BANCO.filter(q => temas.has(q.p + '|' + q.t));
    let lista;
    if (priorizar) {
      pool = pool.map(q => [q, prioridad(q)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
      lista = cantidad === 'todas' ? pool : barajar(sinGruposRepetidos(pool).slice(0, +cantidad));
    } else {
      lista = cantidad === 'todas' ? barajar(pool) : barajar(seleccionarDiverso(pool, +cantidad));
    }
    iniciarSesion('prac', lista);
  }
  function crearRepasoErrores() {
    iniciarSesion('err', barajar(Object.keys(DB.errores).map(id => POR_ID[id]).filter(Boolean)));
  }

  /* ── Evaluación ────────────────────────────────────────────── */
  function respondida(it) {
    const q = it.q, r = it.resp;
    switch (q.tipo) {
      case 'unica': case 'completar': return r !== null && r !== undefined;
      case 'multiple': return r.length === q.c.length;
      case 'sino': return r.every(v => v === 0 || v === 1);
      case 'relacionar': return r.every(v => v >= 0);
    }
    return false;
  }
  function algoRespondido(it) {
    const q = it.q, r = it.resp;
    switch (q.tipo) {
      case 'unica': case 'completar': return r !== null && r !== undefined;
      case 'multiple': return r.length > 0;
      case 'sino': return r.some(v => v === 0 || v === 1);
      case 'relacionar': return r.some(v => v >= 0);
    }
    return false;
  }
  function puntuar(it) {
    const q = it.q, r = it.resp;
    switch (q.tipo) {
      case 'unica': case 'completar':
        return r === q.c ? 1 : 0;
      case 'multiple': {
        const aciertos = r.filter(x => q.c.indexOf(x) >= 0).length;
        return Math.max(0, (aciertos - (r.length - aciertos)) / q.c.length);
      }
      case 'sino':
        return q.a.reduce((s, a, i) => s + (r[i] === (a[1] ? 1 : 0) ? 1 : 0), 0) / q.a.length;
      case 'relacionar':
        return q.pares.reduce((s, p, i) => s + (q.dest[r[i]] === p[1] ? 1 : 0), 0) / q.pares.length;
    }
    return 0;
  }
  function calcular(items) {
    const r = { n: items.length, suma: 0, correctas: 0, partes: {}, temas: {} };
    items.forEach(it => {
      const p = it.puntos;
      r.suma += p;
      if (p === 1) r.correctas++;
      const P = r.partes[it.q.p] = r.partes[it.q.p] || { suma: 0, n: 0 };
      P.suma += p; P.n++;
      const k = it.q.p + '|' + it.q.t;
      const Tm = r.temas[k] = r.temas[k] || { suma: 0, n: 0, p: it.q.p, t: it.q.t, h: it.q.h };
      Tm.suma += p; Tm.n++; Tm.h = Math.min(Tm.h, it.q.h);
    });
    r.pct = r.n ? r.suma / r.n : 0;
    r.pts = Math.round(r.pct * 1000);
    return r;
  }

  /* ── Reloj ─────────────────────────────────────────────────── */
  function iniciarReloj() {
    detenerReloj();
    actualizarReloj();
    reloj = setInterval(actualizarReloj, 1000);
  }
  function detenerReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function actualizarReloj() {
    if (!S || !S.finEn) return;
    const rest = S.finEn - Date.now();
    const el = document.getElementById('reloj');
    if (el) {
      el.textContent = '⏱ ' + fmtTiempo(rest);
      el.classList.toggle('poco', rest < 5 * 60000);
    }
    if (rest <= 0) finalizar(true);
  }

  /* ── Vista: pregunta ───────────────────────────────────────── */
  function htmlPregunta(it, revelar) {
    const q = it.q, r = it.resp;
    let h = '';
    if (q.tipo === 'unica' || q.tipo === 'multiple') {
      h += '<div class="enun">' + q.q + '</div>';
      if (q.tipo === 'multiple' && !revelar) h += '<div class="instr">Seleccionadas: ' + r.length + ' de ' + q.c.length + '</div>';
      h += '<div class="opciones ' + q.tipo + '">';
      it.orden.forEach((oi, k) => {
        const sel = q.tipo === 'unica' ? r === oi : r.indexOf(oi) >= 0;
        const corr = q.tipo === 'unica' ? q.c === oi : q.c.indexOf(oi) >= 0;
        let cls = 'opcion' + (sel ? ' sel' : '');
        let marca = '';
        if (revelar) {
          if (corr && sel) { cls += ' ok'; marca = '✓'; }
          else if (corr) { cls += ' falto'; marca = '✓'; }
          else if (sel) { cls += ' mal'; marca = '✗'; }
        }
        h += '<button type="button" class="' + cls + '" data-act="opt" data-oi="' + oi + '"' + (revelar ? ' disabled' : '') + '>' +
          '<span class="letra">' + LETRAS[k] + '</span><span class="txt">' + q.o[oi] + '</span>' +
          (marca ? '<span class="marca">' + marca + '</span>' : '') + '</button>';
      });
      h += '</div>';
    } else if (q.tipo === 'completar') {
      const partes = q.q.split('___');
      const cls = revelar ? (r === q.c ? ' ok' : ' mal') : '';
      const sel = '<select data-act="hueco" class="hueco' + cls + '"' + (revelar ? ' disabled' : '') + ' aria-label="Respuesta">' +
        '<option value="">— elige —</option>' +
        it.orden.map(oi => '<option value="' + oi + '"' + (r === oi ? ' selected' : '') + '>' + esc(q.o[oi]) + '</option>').join('') +
        '</select>';
      h += '<div class="enun completar">' + partes[0] + sel + (partes[1] || '') + '</div>';
      if (revelar && r !== q.c) h += '<div class="correcta">Respuesta correcta: <b>' + esc(q.o[q.c]) + '</b></div>';
    } else if (q.tipo === 'sino') {
      h += '<div class="enun">' + q.q + '</div><table class="sino"><thead><tr><th>Afirmación</th><th>Sí</th><th>No</th></tr></thead><tbody>';
      it.orden.forEach(ai => {
        const correcto = q.a[ai][1] ? 1 : 0;
        const val = r[ai];
        const celda = opt => {
          let cls = 'sn' + (val === opt ? ' sel' : '');
          if (revelar) {
            if (correcto === opt) cls += val === opt ? ' ok' : ' falto';
            else if (val === opt) cls += ' mal';
          }
          return '<td><button type="button" class="' + cls + '" data-act="sino" data-i="' + ai + '" data-v="' + opt + '"' + (revelar ? ' disabled' : '') + '>' + (opt ? 'Sí' : 'No') + '</button></td>';
        };
        h += '<tr><td>' + q.a[ai][0] + '</td>' + celda(1) + celda(0) + '</tr>';
      });
      h += '</tbody></table>';
    } else if (q.tipo === 'relacionar') {
      h += '<div class="enun">' + q.q + '</div><table class="rel"><tbody>';
      it.orden.forEach(pi => {
        const val = r[pi];
        const ok = q.dest[val] === q.pares[pi][1];
        const cls = revelar ? (ok ? 'ok' : 'mal') : '';
        h += '<tr><td>' + q.pares[pi][0] + '</td><td>' +
          '<select data-act="rel" data-i="' + pi + '" class="' + cls + '"' + (revelar ? ' disabled' : '') + ' aria-label="Respuesta">' +
          '<option value="">— elige —</option>' +
          q.dest.map((d, di) => '<option value="' + di + '"' + (val === di ? ' selected' : '') + '>' + esc(d) + '</option>').join('') +
          '</select>' +
          (revelar && !ok ? '<div class="correcta">Correcta: <b>' + esc(q.pares[pi][1]) + '</b></div>' : '') +
          '</td></tr>';
      });
      h += '</tbody></table>';
    }
    if (revelar) {
      const pts = it.puntos !== null && it.puntos !== undefined ? it.puntos : puntuar(it);
      const est = pts === 1 ? 'ok' : pts > 0 ? 'parcial' : 'mal';
      const tit = pts === 1 ? 'Correcto' : pts > 0 ? 'Parcialmente correcto (' + pct(pts) + ' %)' : (algoRespondido(it) ? 'Incorrecto' : 'Sin responder');
      h += '<div class="expl ' + est + '"><div class="expl-tit">' + tit + '</div><p>' + q.e + '</p>' +
        '<div class="ref">Parte ' + q.p + ' · ' + q.t + ' · <a href="' + resumen(q.h) + '" target="_blank" rel="noopener">Hoja ' + q.h + ' del resumen</a></div></div>';
    }
    return h;
  }

  function vistaQuiz(arriba) {
    VISTA = 'quiz';
    const it = S.items[S.idx];
    const q = it.q;
    const n = S.items.length;
    const sim = S.modo === 'sim';
    const revelar = !sim && it.comprobada;
    let h = '<div class="quiz">';
    h += '<div class="quiz-head"><div><span class="modo-tag">' + NOMBRE_MODO[S.modo] + '</span><b>Pregunta ' + (S.idx + 1) + ' de ' + n + '</b></div>';
    if (sim) {
      h += '<div class="reloj" id="reloj">⏱ ' + fmtTiempo(S.finEn - Date.now()) + '</div>';
    } else {
      const comp = S.items.filter(x => x.comprobada);
      const ok = comp.filter(x => x.puntos === 1).length;
      h += '<div class="marcador">✓ ' + ok + ' &nbsp; ✗ ' + (comp.length - ok) + '</div>';
    }
    h += '</div>';
    const hechas = sim ? S.items.filter(respondida).length : S.items.filter(x => x.comprobada).length;
    h += '<div class="progreso"><div style="width:' + (hechas / n * 100) + '%"></div></div>';
    h += '<section class="card">';
    if (!sim) h += '<div class="meta"><span class="chip">Parte ' + q.p + ' · ' + PARTES[q.p].corto + '</span><span class="chip suave">' + q.t + '</span></div>';
    h += htmlPregunta(it, revelar);
    h += '</section>';

    h += '<div class="acciones">';
    if (sim) {
      h += '<button class="btn sec" data-act="prev"' + (S.idx === 0 ? ' disabled' : '') + '>← Anterior</button>';
      h += '<button class="btn sec' + (it.marcada ? ' activo' : '') + '" data-act="marcar">' + (it.marcada ? '★ Marcada' : '☆ Marcar para revisar') + '</button>';
      if (S.idx < n - 1) h += '<button class="btn" data-act="next">Siguiente →</button>';
      h += '<button class="btn' + (S.idx === n - 1 ? '' : ' sec') + ' derecha" data-act="terminar">Revisar y terminar</button>';
    } else {
      if (!it.comprobada) h += '<button class="btn" data-act="comprobar"' + (respondida(it) ? '' : ' disabled') + '>Comprobar</button>';
      else if (S.idx < n - 1) h += '<button class="btn" data-act="next">Siguiente →</button>';
      else h += '<button class="btn" data-act="terminar">Ver resultados</button>';
      h += '<button class="btn sec derecha" data-act="salir">Terminar ahora</button>';
    }
    h += '</div>';

    if (sim) {
      h += '<section class="card"><b>Navegación</b><div class="paleta">' +
        S.items.map((x, i) => '<button type="button" class="pal' + (i === S.idx ? ' act' : '') + (respondida(x) ? ' resp' : '') + (x.marcada ? ' marc' : '') + '" data-act="ir" data-i="' + i + '" title="Pregunta ' + (i + 1) + '">' + (i + 1) + '</button>').join('') +
        '</div><div class="leyenda"><i class="resp"></i> respondida <i class="marc"></i> marcada <i></i> sin responder</div></section>';
    }
    h += '<p class="atajos">Atajos: teclas 1–6 o A–F para elegir una opción · Enter para ' + (sim ? 'avanzar · ← → para moverte entre preguntas' : 'comprobar y avanzar') + '</p>';
    h += '</div>';
    app.innerHTML = h;
    if (sim) iniciarReloj(); else detenerReloj();
    if (arriba) window.scrollTo(0, 0);
  }

  /* ── Vista: inicio ─────────────────────────────────────────── */
  function vistaInicio() {
    VISTA = 'inicio';
    detenerReloj();
    const ses = cargarSesion();
    const nErr = contarErrores();
    const ult = DB.historial[DB.historial.length - 1];
    const cuenta = p => BANCO.filter(q => q.p === p).length;
    const tam = (DB.ultimoTam || TAMANOS[0]).join('|');
    let h = '';
    if (ses && !ses.terminada) {
      const resp = ses.items.filter(respondida).length;
      const rest = ses.finEn ? ses.finEn - Date.now() : null;
      h += '<div class="aviso"><div><b>Tienes ' + (ses.modo === 'sim' ? 'un simulacro' : 'una sesión de ' + NOMBRE_MODO[ses.modo].toLowerCase()) + ' en curso.</b><br>' +
        '<span class="mini">Pregunta ' + (ses.idx + 1) + ' de ' + ses.items.length + ' · ' + resp + ' respondidas' +
        (rest !== null ? ' · ' + (rest > 0 ? 'quedan ' + fmtTiempo(rest) : 'tiempo agotado') : '') + '</span></div>' +
        '<div class="fila"><button class="btn" data-act="continuar">Continuar</button><button class="btn sec" data-act="descartar">Descartar</button></div></div>';
    }
    h += '<section class="hero"><h1>Cuestionarios DP-900</h1>' +
      '<p>' + BANCO.length + ' preguntas basadas en tu resumen, al estilo del examen: escenarios, opción múltiple, Sí/No, completar y relacionar. El orden de las preguntas y de las opciones cambia en cada intento.</p>' +
      [1, 2, 3, 4].map(p => '<span class="chip">Parte ' + p + ' · ' + PARTES[p].corto + ': ' + cuenta(p) + '</span>').join('') + '</section>';

    h += '<div class="modos">';
    h += '<section class="card modo-card"><h2>Simulacro de examen</h2>' +
      '<p>Preguntas al azar con el peso de cada parte del examen real, temporizador y puntuación sobre 1000. Las respuestas se revisan al final.</p>' +
      '<label class="campo">Tamaño<select id="sim-tam">' +
      TAMANOS.map(t => '<option value="' + t.join('|') + '"' + (t.join('|') === tam ? ' selected' : '') + '>' + t[0] + ' preguntas · ' + t[1] + ' min</option>').join('') +
      '</select></label>' +
      (ult ? '<p class="mini">Último simulacro: <b>' + ult.pts + '</b> / 1000 (' + (ult.pts >= APROBADO ? 'aprobado' : 'no aprobado') + ') · ' + fmtFecha(ult.f) + '</p>' : '') +
      '<button class="btn grande" data-act="sim-start">Empezar simulacro</button></section>';

    h += '<section class="card modo-card"><h2>Práctica por tema</h2><p>Sin tiempo y con la explicación después de cada pregunta.</p>' +
      '<div class="partes-sel">' + [1, 2, 3, 4].map(p => '<label class="chk"><input type="checkbox" class="sel-parte" value="' + p + '" checked> Parte ' + p + ' · ' + PARTES[p].corto + '<span class="cnt">' + cuenta(p) + '</span></label>').join('') + '</div>' +
      '<details class="temas"><summary>Elegir temas concretos</summary>' +
      [1, 2, 3, 4].map(p => '<div class="grupo-temas"><div class="gt-tit">Parte ' + p + '</div>' +
        TEMAS.map((t, i) => t.p === p ? '<label class="chk"><input type="checkbox" class="sel-tema" data-p="' + p + '" value="' + i + '" checked> ' + t.t + '<span class="cnt">' + t.n + '</span></label>' : '').join('') + '</div>').join('') +
      '</details>' +
      '<label class="campo">Preguntas<select id="prac-n"><option>10</option><option selected>20</option><option>40</option><option value="todas">Todas las del tema</option></select></label>' +
      '<label class="chk"><input type="checkbox" id="prac-prio" checked> Priorizar las no vistas y las falladas</label>' +
      '<div style="height:12px"></div>' +
      '<button class="btn grande" data-act="prac-start">Empezar práctica</button></section>';

    h += '<section class="card modo-card"><h2>Repaso de errores</h2>' +
      '<p>Solo las preguntas que has fallado. Cada una sale de la lista cuando la aciertas dos veces seguidas.</p>' +
      '<p class="cifra">' + nErr + ' <span>pendiente' + (nErr === 1 ? '' : 's') + '</span></p>' +
      '<button class="btn grande" data-act="err-start"' + (nErr ? '' : ' disabled') + '>Repasar errores</button></section>';
    h += '</div>';
    h += '<p class="pie">Tu progreso se guarda en este navegador. · <a href="' + resumen() + '">Abrir el resumen</a></p>';
    app.innerHTML = h;
  }

  /* ── Vista: resultados ─────────────────────────────────────── */
  function finalizar(porTiempo) {
    detenerReloj();
    if (!S) return;
    const sim = S.modo === 'sim';
    let items;
    if (sim) {
      items = S.items;
      items.forEach(it => {
        it.puntos = puntuar(it);
        if (algoRespondido(it)) registrar(it.q, it.puntos === 1);
      });
    } else {
      items = S.items.filter(it => it.comprobada);
      items.forEach(it => { if (it.puntos === null || it.puntos === undefined) it.puntos = puntuar(it); });
    }
    const dur = (sim ? Math.min(Date.now(), S.finEn) : Date.now()) - S.inicio;
    const res = calcular(items);
    if (sim) {
      const partes = {};
      Object.keys(res.partes).forEach(p => { partes[p] = pct(res.partes[p].suma / res.partes[p].n); });
      DB.historial.push({ f: Date.now(), pts: res.pts, n: items.length, dur: dur, partes: partes });
      if (DB.historial.length > 100) DB.historial.shift();
    }
    guardar();
    const modo = S.modo;
    S.terminada = true;
    guardarSesion();
    S = null;
    if (!items.length) { vistaInicio(); return; }
    ULTIMO = { items: items, res: res, modo: modo, porTiempo: !!porTiempo, dur: dur };
    FILTRO = 'todas';
    vistaResultados();
    window.scrollTo(0, 0);
  }

  function filaBarra(etiqueta, x, n) {
    return '<div class="barra-fila"><span>' + etiqueta + '</span><div class="barra"><div class="' + (x >= 0.7 ? 'ok' : 'mal') + '" style="width:' + pct(x) + '%"></div></div>' +
      '<span class="bv">' + pct(x) + ' % <small>(' + n + ')</small></span></div>';
  }

  function vistaResultados() {
    VISTA = 'resultados';
    detenerReloj();
    const U = ULTIMO;
    const res = U.res;
    const sim = U.modo === 'sim';
    const aprobado = res.pts >= APROBADO;
    let h = '<section class="card">';
    if (sim) {
      h += '<div class="res-top"><div class="puntaje ' + (aprobado ? 'ok' : 'mal') + '">' + res.pts + '<span>/ 1000</span></div><div>' +
        '<div class="veredicto ' + (aprobado ? 'ok' : 'mal') + '">' + (aprobado ? 'Aprobado' : 'No aprobado') + '</div>' +
        '<p>Se aprueba con ' + APROBADO + '. ' + res.correctas + ' de ' + res.n + ' preguntas completamente correctas · tiempo usado ' + fmtTiempo(U.dur) + '.</p>' +
        (U.porTiempo ? '<p class="alerta">Se acabó el tiempo: las preguntas sin responder cuentan como incorrectas.</p>' : '') +
        '<p class="mini">La puntuación es proporcional a tus aciertos (con crédito parcial); el examen real usa su propia escala.</p></div></div>';
    } else {
      h += '<div class="res-top"><div class="puntaje ' + (res.pct >= 0.7 ? 'ok' : 'mal') + '">' + pct(res.pct) + '<span>%</span></div><div>' +
        '<div class="veredicto">' + NOMBRE_MODO[U.modo] + ' terminada</div>' +
        '<p>' + res.correctas + ' de ' + res.n + ' preguntas completamente correctas (equivale a unos ' + res.pts + ' puntos de 1000).</p></div></div>';
    }
    h += '<h3>Por parte</h3>' + [1, 2, 3, 4].filter(p => res.partes[p]).map(p => filaBarra('Parte ' + p + ' · ' + PARTES[p].corto, res.partes[p].suma / res.partes[p].n, res.partes[p].n)).join('');
    const debiles = Object.keys(res.temas).map(k => res.temas[k]).filter(t => t.suma / t.n < 0.7).sort((a, b) => a.suma / a.n - b.suma / b.n);
    if (debiles.length) {
      h += '<h3>Temas a repasar</h3><ul class="debiles">' + debiles.map(t => '<li><b>' + t.t + '</b> <span class="mini">Parte ' + t.p + ' · ' + pct(t.suma / t.n) + ' % · hoja ' + t.h + '</span></li>').join('') + '</ul>';
    }
    const nErr = contarErrores();
    h += '<div class="fila" style="margin-top:18px">' +
      (nErr ? '<button class="btn" data-act="err-start">Repasar errores (' + nErr + ')</button>' : '') +
      (sim ? '<button class="btn sec" data-act="sim-otra">Otro simulacro</button>' : '') +
      '<button class="btn sec" data-act="home">Volver al inicio</button></div></section>';

    const malas = U.items.filter(it => it.puntos < 1).length;
    const marcadas = U.items.filter(it => it.marcada).length;
    const chip = (f, txt) => '<button class="chip-btn' + (FILTRO === f ? ' act' : '') + '" data-act="filtro" data-f="' + f + '">' + txt + '</button>';
    h += '<div class="rev-head"><h2>Revisión</h2><div class="filtros">' + chip('todas', 'Todas (' + U.items.length + ')') + chip('mal', 'Con errores (' + malas + ')') +
      (sim && marcadas ? chip('marc', 'Marcadas (' + marcadas + ')') : '') + '</div></div>';
    U.items.forEach((it, i) => {
      if (FILTRO === 'mal' && it.puntos === 1) return;
      if (FILTRO === 'marc' && !it.marcada) return;
      h += '<article class="card"><div class="rev-num">Pregunta ' + (i + 1) + (it.marcada ? ' · ★ marcada' : '') + '</div>' + htmlPregunta(it, true) + '</article>';
    });
    app.innerHTML = h;
  }

  /* ── Vista: progreso ───────────────────────────────────────── */
  function agregado(qs) {
    let v = 0, a = 0, vistas = 0;
    qs.forEach(q => { const s = DB.stats[q.id]; if (s) { v += s.v; a += s.a; vistas++; } });
    return { v: v, a: a, vistas: vistas, n: qs.length, pct: v ? a / v : null };
  }
  function vistaEstadisticas() {
    VISTA = 'stats';
    detenerReloj();
    const total = agregado(BANCO);
    let h = '<section class="card"><h2 style="margin-top:0">Tu progreso</h2><div class="kpis">' +
      '<div><b>' + total.vistas + '</b><span>de ' + BANCO.length + ' preguntas vistas</span></div>' +
      '<div><b>' + (total.v ? pct(total.pct) + ' %' : '—') + '</b><span>de aciertos (' + total.v + ' respuestas)</span></div>' +
      '<div><b>' + contarErrores() + '</b><span>errores pendientes de repasar</span></div>' +
      '<div><b>' + DB.historial.length + '</b><span>simulacros completados</span></div></div>';

    h += '<h3>Aciertos por parte</h3>';
    [1, 2, 3, 4].forEach(p => {
      const a = agregado(BANCO.filter(q => q.p === p));
      h += a.v ? filaBarra('Parte ' + p + ' · ' + PARTES[p].corto, a.pct, a.vistas + '/' + a.n) :
        '<div class="barra-fila"><span>Parte ' + p + ' · ' + PARTES[p].corto + '</span><div class="barra"></div><span class="bv mini">sin datos</span></div>';
    });

    const filas = TEMAS.map(t => Object.assign({ t: t }, agregado(BANCO.filter(q => q.p === t.p && q.t === t.t))));
    filas.sort((x, y) => (x.pct === null) - (y.pct === null) || (x.pct || 0) - (y.pct || 0));
    h += '<h3>Por tema <span class="mini">(los más débiles primero)</span></h3><table class="tabla"><thead><tr><th>Tema</th><th>Parte</th><th class="num">Hoja</th><th class="num">Vistas</th><th class="num">Aciertos</th></tr></thead><tbody>' +
      filas.map(f => '<tr><td>' + f.t.t + '</td><td>' + f.t.p + '</td><td class="num">' + f.t.h + '</td><td class="num">' + f.vistas + '/' + f.n + '</td><td class="num ' +
        (f.pct === null ? '' : f.pct < 0.7 ? 'pct-bajo' : 'pct-alto') + '">' + (f.pct === null ? '—' : pct(f.pct) + ' %') + '</td></tr>').join('') +
      '</tbody></table>';

    if (DB.historial.length) {
      h += '<h3>Historial de simulacros</h3><table class="tabla"><thead><tr><th>Fecha</th><th class="num">Puntos</th><th class="num">Preguntas</th><th class="num">Tiempo</th><th class="num">P1 · P2 · P3 · P4</th></tr></thead><tbody>' +
        DB.historial.slice().reverse().map(x => '<tr><td>' + fmtFecha(x.f) + '</td><td class="num ' + (x.pts >= APROBADO ? 'pct-alto' : 'pct-bajo') + '">' + x.pts + '</td><td class="num">' + x.n + '</td><td class="num">' + fmtTiempo(x.dur) + '</td><td class="num">' +
          [1, 2, 3, 4].map(p => (x.partes && x.partes[p] !== undefined ? x.partes[p] + '%' : '—')).join(' · ') + '</td></tr>').join('') +
        '</tbody></table>';
    }
    h += '<div class="fila" style="margin-top:20px"><button class="btn peligro" data-act="reset">Borrar todo el progreso</button></div></section>';
    app.innerHTML = h;
  }

  /* ── Acciones ──────────────────────────────────────────────── */
  function cur() { return S && S.items[S.idx]; }
  function editable(it) { return S && !S.terminada && it && !(S.modo !== 'sim' && it.comprobada); }
  function salirDeSimulacro() {
    return !(VISTA === 'quiz' && S && S.modo === 'sim') || confirm('El simulacro queda guardado, pero el tiempo sigue corriendo. ¿Salir?');
  }

  const ACCIONES = {
    home: () => { if (salirDeSimulacro()) vistaInicio(); },
    stats: () => { if (salirDeSimulacro()) vistaEstadisticas(); },
    continuar: () => {
      S = cargarSesion();
      if (!S) { vistaInicio(); return; }
      if (S.finEn && S.finEn <= Date.now()) { finalizar(true); return; }
      vistaQuiz(true);
    },
    descartar: () => {
      if (!confirm('¿Descartar la sesión en curso? Lo que respondiste en ella no se guardará.')) return;
      localStorage.removeItem(KEY_SES);
      S = null;
      vistaInicio();
    },
    'sim-start': () => {
      if (hayOtraSesion()) return;
      const t = document.getElementById('sim-tam').value.split('|').map(Number);
      DB.ultimoTam = t;
      guardar();
      crearSimulacro(t[0], t[1]);
    },
    'sim-otra': () => {
      if (hayOtraSesion()) return;
      const t = DB.ultimoTam || TAMANOS[0];
      crearSimulacro(t[0], t[1]);
    },
    'prac-start': () => {
      if (hayOtraSesion()) return;
      const temas = new Set();
      document.querySelectorAll('.sel-tema:checked').forEach(c => { const t = TEMAS[+c.value]; temas.add(t.p + '|' + t.t); });
      if (!temas.size) { toast('Elige al menos un tema.'); return; }
      crearPractica(temas, document.getElementById('prac-n').value, document.getElementById('prac-prio').checked);
    },
    'err-start': () => {
      if (hayOtraSesion()) return;
      crearRepasoErrores();
    },
    opt: b => {
      const it = cur();
      if (!editable(it)) return;
      const q = it.q;
      const oi = +b.dataset.oi;
      if (q.tipo === 'unica') it.resp = oi;
      else {
        const i = it.resp.indexOf(oi);
        if (i >= 0) it.resp.splice(i, 1);
        else if (it.resp.length < q.c.length) it.resp.push(oi);
        else { toast('Esta pregunta pide ' + q.c.length + ' respuestas. Quita una para elegir otra.'); return; }
      }
      guardarSesion();
      vistaQuiz();
    },
    sino: b => {
      const it = cur();
      if (!editable(it)) return;
      it.resp[+b.dataset.i] = +b.dataset.v;
      guardarSesion();
      vistaQuiz();
    },
    comprobar: () => {
      const it = cur();
      if (!editable(it) || !respondida(it)) return;
      it.comprobada = true;
      it.puntos = puntuar(it);
      registrar(it.q, it.puntos === 1);
      guardar();
      guardarSesion();
      vistaQuiz();
    },
    next: () => { if (S.idx < S.items.length - 1) { S.idx++; guardarSesion(); vistaQuiz(true); } },
    prev: () => { if (S.idx > 0) { S.idx--; guardarSesion(); vistaQuiz(true); } },
    ir: b => { S.idx = +b.dataset.i; guardarSesion(); vistaQuiz(true); },
    marcar: () => { const it = cur(); it.marcada = !it.marcada; guardarSesion(); vistaQuiz(); },
    terminar: () => {
      if (S.modo === 'sim') {
        const sinResp = S.items.filter(it => !respondida(it)).length;
        const marcadas = S.items.filter(it => it.marcada).length;
        let msg = '¿Terminar el simulacro y ver la puntuación?';
        if (sinResp) msg += '\n\nTienes ' + sinResp + ' pregunta' + (sinResp === 1 ? '' : 's') + ' sin responder o incompleta' + (sinResp === 1 ? '' : 's') + '.';
        if (marcadas) msg += '\nTienes ' + marcadas + ' marcada' + (marcadas === 1 ? '' : 's') + ' para revisar.';
        if (!confirm(msg)) return;
      }
      finalizar(false);
    },
    salir: () => {
      const comp = S.items.filter(it => it.comprobada).length;
      if (!comp) {
        if (!confirm('¿Salir sin responder ninguna pregunta?')) return;
        S.terminada = true; guardarSesion(); S = null; vistaInicio();
        return;
      }
      if (confirm('¿Terminar ahora? Verás el resultado de las ' + comp + ' preguntas que comprobaste.')) finalizar(false);
    },
    filtro: b => { FILTRO = b.dataset.f; vistaResultados(); },
    reset: () => {
      if (!confirm('¿Borrar todas las estadísticas, el historial de simulacros y la lista de errores? No se puede deshacer.')) return;
      DB = { stats: {}, errores: {}, historial: [], ultimoTam: DB.ultimoTam };
      guardar();
      vistaEstadisticas();
    }
  };

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled || b.tagName === 'SELECT') return;
    const fn = ACCIONES[b.dataset.act];
    if (fn) fn(b, e);
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.classList.contains('sel-parte')) {
      document.querySelectorAll('.sel-tema[data-p="' + t.value + '"]').forEach(c => { c.checked = t.checked; });
      return;
    }
    if (t.classList.contains('sel-tema')) {
      const todos = Array.from(document.querySelectorAll('.sel-tema[data-p="' + t.dataset.p + '"]'));
      const marcados = todos.filter(c => c.checked).length;
      const parte = document.querySelector('.sel-parte[value="' + t.dataset.p + '"]');
      parte.checked = marcados > 0;
      parte.indeterminate = marcados > 0 && marcados < todos.length;
      return;
    }
    const it = cur();
    if (!editable(it)) return;
    if (t.dataset.act === 'hueco') {
      it.resp = t.value === '' ? null : +t.value;
      guardarSesion();
      vistaQuiz();
      const el = app.querySelector('select[data-act="hueco"]');
      if (el) el.focus();
    } else if (t.dataset.act === 'rel') {
      const i = t.dataset.i;
      it.resp[+i] = t.value === '' ? -1 : +t.value;
      guardarSesion();
      vistaQuiz();
      const el = app.querySelector('select[data-act="rel"][data-i="' + i + '"]');
      if (el) el.focus();
    }
  });

  document.addEventListener('keydown', e => {
    if (VISTA !== 'quiz' || !S || e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = e.target.tagName;
    if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    const it = cur();
    const q = it.q;
    const k = e.key.toLowerCase();
    if ((q.tipo === 'unica' || q.tipo === 'multiple') && k.length === 1) {
      let i = '123456789'.indexOf(k);
      if (i < 0) i = 'abcdefghi'.indexOf(k);
      if (i >= 0 && i < it.orden.length) {
        e.preventDefault();
        ACCIONES.opt({ dataset: { oi: it.orden[i] } });
        return;
      }
    }
    if (e.key === 'Enter') {
      if (tag === 'BUTTON') return;
      const btn = app.querySelector('.acciones .btn:not(.sec):not([disabled])');
      if (btn) { e.preventDefault(); btn.click(); }
    } else if (S.modo === 'sim' && e.key === 'ArrowRight') {
      ACCIONES.next();
    } else if (S.modo === 'sim' && e.key === 'ArrowLeft') {
      ACCIONES.prev();
    }
  });

  document.querySelectorAll('a[data-resumen]').forEach(a => { a.href = resumen(); });
  vistaInicio();
})();
</script>
</body>
</html>
